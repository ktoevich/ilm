<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main">
        <header>
            <h3 style="cursor: pointer;" onclick="window.location.href='index.html'">На главную</h3>
            <h3 style="cursor: pointer;" onclick="window.location.href='login.html'">Войти</h3>
        </header>
        <div class="login">
            <input type="email" class="input-email" placeholder="Email" required>
            <input type="password" class="input-password" placeholder="Пароль" required>
            <button class="login-btn"><p>Войти</p></button>
            <div id="login-error" style="color: #e63946; margin-top: 10px; font-family: system-ui, sans-serif; font-size: 14px; min-height: 20px;"></div>
        </div>
    </div>
    <style>
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Times New Roman', Times, serif;
            margin-top: 50px;
        }
        header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .login {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }
        .login input {
            padding: 8px;
            font-size: 16px;
        }
        .login-btn {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .login-btn p {
            margin: 0;
        }
    </style>
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:'
          ? 'http://127.0.0.1:8000/api'
          : '/api';

        document.querySelector('.login-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const emailInput = document.querySelector('.input-email');
            const passInput = document.querySelector('.input-password');
            const errorDiv = document.getElementById('login-error');
            errorDiv.textContent = '';

            const email = emailInput ? emailInput.value.trim() : '';
            const password = passInput ? passInput.value : '';

            if (!email || !password) {
                errorDiv.textContent = 'Пожалуйста, заполните все поля';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Неверный email или пароль');
                }

                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('auth_user', JSON.stringify(data.user));

                // Redirect to main page
                window.location.href = 'index.html';
            } catch (err) {
                errorDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
