<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Analysis API - Тест</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #4CAF50;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f0f8f0;
            border-color: #2E7D32;
        }
        
        .upload-area.dragover {
            background: #e8f5e9;
            border-color: #1B5E20;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview {
            margin: 20px 0;
            text-align: center;
        }
        
        .preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .result {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result h3 {
            color: #2E7D32;
            margin-bottom: 15px;
        }
        
        .result-item {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        
        .result-item strong {
            color: #333;
        }
        
        .crops-list {
            list-style: none;
            padding-left: 0;
        }
        
        .crops-list li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .crops-list li:before {
            content: "🌱";
            position: absolute;
            left: 0;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Анализ Почвы</h1>
        <p class="subtitle">Загрузите фото почвы для анализа</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <p>Нажмите или перетащите изображение сюда</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="preview" id="preview"></div>
        
        <button id="analyzeBtn" disabled>Анализировать</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Анализируем почву...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <h3>📊 Результаты анализа</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');
        const errorDiv = document.getElementById('error');
        
        let selectedFile = null;
        
        // Клик по области загрузки
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });
        
        // Выбор файла
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        function handleFile(file) {
            selectedFile = file;
            
            // Показываем превью
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
            
            // Скрываем результаты
            result.classList.remove('show');
            errorDiv.classList.remove('show');
        }
        
        // Анализ
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            loading.classList.add('show');
            result.classList.remove('show');
            errorDiv.classList.remove('show');
            analyzeBtn.disabled = true;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResult(data);
                } else {
                    showError(data.detail || 'Ошибка при анализе');
                }
            } catch (error) {
                showError('Не удалось подключиться к API. Убедитесь, что сервер запущен.');
            } finally {
                loading.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        });
        
        function displayResult(data) {
            const crops = data.recommended_crops.map(crop => `<li>${crop}</li>`).join('');
            
            resultContent.innerHTML = `
                <div class="result-item">
                    <strong>Тип почвы:</strong> ${data.soil_type}
                </div>
                <div class="result-item">
                    <strong>Уверенность:</strong> ${(data.confidence * 100).toFixed(2)}%
                </div>
                <div class="result-item">
                    <strong>Плодородность:</strong> ${data.fertility}
                </div>
                <div class="result-item">
                    <strong>Описание:</strong> ${data.description}
                </div>
                <div class="result-item">
                    <strong>Визуальные характеристики:</strong> ${data.visual_characteristics}
                </div>
                <div class="result-item">
                    <strong>Рекомендуемые культуры:</strong>
                    <ul class="crops-list">${crops}</ul>
                </div>
            `;
            
            result.classList.add('show');
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
    </script>
</body>
</html>
