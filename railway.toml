# Railway deployment for the Django backend (the frontend stays on Vercel).
#
# Set these variables on the Railway service before the first deploy:
#   DJANGO_DEBUG=False
#   DJANGO_SECRET_KEY=<python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())">
#   DATABASE_URL=<Neon connection string, or ${{Postgres.DATABASE_URL}} for a Railway Postgres>
#   GEOCODER_CONTACT=<your e-mail, asked for by Nominatim's usage policy>
# Optional:
#   REDIS_URL=${{Redis.REDIS_URL}}   # shared tile/SoilGrids cache across restarts
#   DJANGO_ALLOWED_HOSTS=...         # only for a custom domain; the Railway
#                                    # domain is picked up from RAILWAY_PUBLIC_DOMAIN
#
# Then copy the service's public domain into the "/api/:path*" rewrite in
# vercel.json and frontend/vercel.json and redeploy the frontend.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs inside the freshly built image before traffic is switched over, so a
# deploy whose migrations fail never replaces the running one.
preDeployCommand = ["python manage.py migrate --noinput"]

# Unauthenticated, throttle-free, exempt from the HTTPS redirect: Railway
# probes it over plain HTTP with the Host header "healthcheck.railway.app".
healthcheckPath = "/api/health/"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
